name: Deploy landing page to GitHub Pages

# The landing always ships from the latest release branch. Every
# version-* branch carries this workflow, but only the repository's default
# branch deploys; the default branch is kept pointing at the newest
# version-X.Y.Z branch, so the site follows each new release without
# editing this file.
on:
  push:
    branches: ["version-*"]
    paths:
      - "landing/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload landing artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./landing

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
